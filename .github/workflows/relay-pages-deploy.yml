name: Relay Pages Deploy on Release

# ─────────────────────────────────────────────────────────────
# Release 发布后的 GitHub Pages 部署转发工作流
#
# 背景：release 事件触发的 run 运行在 tag ref（如 refs/tags/v2.1.1）上，
#       而 github-pages 环境配置了"仅限 miuix 分支"的部署保护规则，
#       tag 无法通过该规则，直接部署会被拒绝：
#         "Tag ... is not allowed to deploy to github-pages due to
#          environment protection rules."
#
# 方案：本工作流不做部署，仅用已认证 token 在 miuix 分支上重新触发
#       deploy-pages.yml（workflow_dispatch）。该 run 运行于 miuix ref，
#       满足环境保护规则；部署时的 Bake 步骤会实时查询最新 release，
#       因此页面版本号仍能及时刷新到刚发布的 tag。
# ─────────────────────────────────────────────────────────────

on:
  release:
    types:
      - published

permissions:
  contents: read
  actions: write # 触发 deploy-pages.yml 所需的权限

jobs:
  relay:
    name: Dispatch Pages deploy on miuix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch deploy-pages.yml on miuix branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --ref miuix
          echo "已触发 miuix 分支上的 GitHub Pages 部署，将以最新 release 刷新页面版本号"
