name: iOS Build

# 在没有 Mac 的机器上也能拿到 iOS 侧的真实编译错误：
# - 用 GitHub 托管的 macOS runner（公开仓库免费）
# - 先链接 Kotlin/Native framework，再用 xcodebuild 编译 SwiftUI 壳
#
# 注意：模拟器编译不需要签名，也不需要 Apple Developer 账号。

on:
  workflow_dispatch:
  # 不限定分支：只在改动 iOS / 共享内核相关路径时触发，特性分支也能直接验证
  push:
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_VERSION: '9.4.1'

jobs:
  build-ios:
    name: Build iOS app (simulator)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Kotlin/Native 工具链 (~1GB) 与 Gradle 缓存，命中后第二次开始快很多
      - name: Cache Kotlin/Native and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-v1

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Link Shared.framework (Kotlin/Native)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace --console=plain

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate

      - name: Build app for simulator (no code signing)
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild \
            -project HamKit.xcodeproj \
            -scheme HamKit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ../ios-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log-${{ github.run_id }}
          path: ios-build.log
          retention-days: 14

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HamKit-ios-simulator-${{ github.run_id }}
          path: iosApp/build/Build/Products/Debug-iphonesimulator/HamKit.app
          retention-days: 14
          if-no-files-found: warn
