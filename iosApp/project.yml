name: HamKit
options:
  bundleIdPrefix: click.hamkit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # 工程只声明了 iosArm64 / iosSimulatorArm64 两个 Kotlin/Native 目标。
    # Xcode 的 "generic/platform=iOS Simulator" 默认会同时要 arm64 + x86_64，
    # 导致 embedAndSignAppleFrameworkForXcode 报 "Xcode Requested Architecture
    # Not Configured in Gradle: ios_x64"。这里固定 arm64。
    ARCHS: "arm64"
    ONLY_ACTIVE_ARCH: "YES"
    # Kotlin/Native 产出的 Shared.framework 由下面的 Run Script 生成到该目录
    FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework Shared"

targets:
  HamKit:
    type: application
    platform: iOS
    sources:
      - path: HamKit
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: click.hamkit.ios
        PRODUCT_NAME: HamKit
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 用仓库里的 Info.plist 作为唯一来源。
        # 注意：不要在这里再写 XcodeGen 的 `info:` 块——它会用 properties 重新生成
        # 一份最小 plist，把 UILaunchScreen / NSLocationWhenInUseUsageDescription
        # 等键全部冲掉（表现为应用以兼容模式黑边显示、真机请求定位直接崩溃）。
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: HamKit/Info.plist
        # 静态 framework 不需要在产物里再嵌入一次
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    preBuildScripts:
      - name: Build Shared.framework (Kotlin Multiplatform)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          if [ ! -x "./gradlew" ]; then
            echo "error: 找不到 gradlew，请确认 iosApp 位于仓库根目录下" >&2
            exit 1
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    # 显式生成 scheme，否则命令行 xcodebuild -scheme 找不到（Xcode GUI 会自动补）
    scheme:
      gatherCoverageData: false
